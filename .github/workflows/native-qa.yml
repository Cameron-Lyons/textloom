name: Native interaction QA

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/native-qa.yml'
      - '.github/workflows/release.yml'
      - 'scripts/native-qa/**'
      - 'scripts/check_native_report.py'
      - 'scripts/test_native_report.py'
      - 'examples/native-editor/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: native-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TEXTLOOM_QA_REVISION: ${{ github.sha }}

jobs:
  macos-interaction:
    name: Native interaction (macOS TextEdit)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build native host
        run: cargo build --locked --manifest-path examples/native-editor/Cargo.toml --target-dir target
      - name: Native keyboard and external clipboard interaction
        timeout-minutes: 5
        run: python3 scripts/native-qa/macos_interaction.py
      - name: Native interaction observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-interaction-macos
          path: native-qa-observations/**
          if-no-files-found: warn
          retention-days: 14

  windows-reader:
    name: Native reader (Windows NVDA)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build native host
        run: cargo build --locked --manifest-path examples/native-editor/Cargo.toml --target-dir target
      - name: Install signed Mesa software renderer
        id: mesa
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          release: false
          update: true
          install: mingw-w64-ucrt-x86_64-mesa
      - name: Record renderer package versions
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p native-qa-observations
          pacman -Q > native-qa-observations/mesa-packages.log
      - name: Native NVDA speech, selection, and editing
        timeout-minutes: 5
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.mesa.outputs.msys2-location }}
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          $mesaRuntimeDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $nativeProbeDirectory = Join-Path $env:RUNNER_TEMP 'textloom-native-reader'
          New-Item -ItemType Directory -Path $nativeProbeDirectory | Out-Null
          Copy-Item -LiteralPath ./target/debug/textloom-native-example.exe -Destination $nativeProbeDirectory
          Copy-Item -LiteralPath "$mesaRuntimeDirectory\opengl32.dll" -Destination $nativeProbeDirectory
          Copy-Item -LiteralPath "$mesaRuntimeDirectory\libgallium_wgl.dll" -Destination $nativeProbeDirectory
          $env:PATH = "$mesaRuntimeDirectory;$env:PATH"
          $env:GLUTIN_WGL_OPENGL_DLL = Join-Path $nativeProbeDirectory 'opengl32.dll'
          ./scripts/native-qa/windows_reader.ps1 -NativeExecutable (Join-Path $nativeProbeDirectory 'textloom-native-example.exe')
      - name: Native reader observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-reader-windows
          path: native-qa-observations/**
          if-no-files-found: warn
          retention-days: 14
