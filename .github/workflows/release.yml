name: Release verification

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Validate version
        shell: bash
        run: |
          package_id=$(cargo pkgid --offline)
          version=${package_id##*[#@]}
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version v$version" >&2
            exit 1
          fi

  checks:
    name: Release checks
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    name: Verified package artifact
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Build and verify archive
        run: cargo package --locked --all-features
      - name: Checksum
        working-directory: target/package
        run: sha256sum textloom-*.crate > SHA256SUMS
      # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: textloom-${{ github.ref_name }}
          path: |
            target/package/textloom-*.crate
            target/package/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
