name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TEXTLOOM_QA_REVISION: ${{ github.sha }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            examples/native-editor -> ../../target
            scripts/qa-tools -> ../../target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting, including nightly-only style options
        run: ./scripts/format.sh --check
      - name: Complete release checks
        run: ./scripts/check-release.sh
      - name: QA tool lints and regression tests
        run: |
          cargo clippy --locked --manifest-path scripts/qa-tools/Cargo.toml --all-targets --target-dir target -- -D warnings
          cargo test --locked --manifest-path scripts/qa-tools/Cargo.toml --target-dir target

  msrv:
    name: MSRV and feature combinations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            examples/native-editor -> ../../target
            scripts/qa-tools -> ../../target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests and doctests for every feature combination
        run: |
          for features in '' egui winit accesskit egui,winit egui,accesskit winit,accesskit egui,winit,accesskit; do
            cargo test --locked --no-default-features --features "$features"
          done
      - name: Benchmarks compile
        run: cargo build --locked --all-features --benches
      - name: Native host compiles, CLI and report tests
        run: cargo test --locked --all-targets --manifest-path examples/native-editor/Cargo.toml --target-dir target

  minimal-versions:
    name: Minimal dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: nightly
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: '1.95.0'
      - name: Resolve the lowest direct dependency versions
        run: cargo +nightly update -Z direct-minimal-versions
      - name: All targets compile
        run: cargo +1.95.0 check --locked --all-features --all-targets

  dependencies:
    name: Dependency policy (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Library
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check ${{ matrix.checks }}
          rust-version: '1.95.0'
      - name: Native host
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: examples/native-editor/Cargo.toml
          command: check ${{ matrix.checks }}
          rust-version: '1.95.0'
      - name: QA tools
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          manifest-path: scripts/qa-tools/Cargo.toml
          command: check ${{ matrix.checks }}
          rust-version: '1.95.0'

  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            examples/native-editor -> ../../target
            scripts/qa-tools -> ../../target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: All targets compile without Clippy warnings
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Native host compiles without Clippy warnings
        run: cargo clippy --locked --all-targets --manifest-path examples/native-editor/Cargo.toml --target-dir target -- -D warnings
      - name: Native host CLI and report tests
        run: cargo test --locked --all-targets --manifest-path examples/native-editor/Cargo.toml --target-dir target
      - name: Tests and doctests
        run: cargo test --locked --all-features
      - name: Build native renderer and report validator
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --manifest-path examples/native-editor/Cargo.toml --target-dir target
          cargo build --locked --manifest-path scripts/qa-tools/Cargo.toml --target-dir target --bin check-native-report
      - name: Native rendering smoke with default clipboard (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p native-observations
          for mode in editable read-only disabled; do
            args=(--smoke-test --qa-report "native-observations/default-$mode.json")
            case "$mode" in
              read-only) args+=(--read-only) ;;
              disabled) args+=(--disabled) ;;
            esac
            smoke_status=0
            ./target/debug/textloom-native-example "${args[@]}" 2> "native-smoke-default-$mode.log" | tee "native-smoke-default-$mode.stdout" || smoke_status=$?
            cat "native-smoke-default-$mode.stdout" >> "native-smoke-default-$mode.log"
            if [ "$smoke_status" -ne 0 ]; then exit "$smoke_status"; fi
            grep -E '^Rendered 20 native frames at [0-9.]+ pixels per point$' "native-smoke-default-$mode.stdout"
            ./target/debug/check-native-report "native-observations/default-$mode.json" --revision "$TEXTLOOM_QA_REVISION" --os macos --mode "$mode" --clipboard default
          done
      - name: Native rendering smoke (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p native-observations
          for mode in editable read-only disabled; do
            args=(--smoke-test --rich-clipboard --qa-report "native-smoke-$mode.json")
            case "$mode" in
              editable) args+=(--clipboard-self-test) ;;
              read-only) args+=(--read-only) ;;
              disabled) args+=(--disabled) ;;
            esac
            smoke_status=0
            ./target/debug/textloom-native-example "${args[@]}" 2> "native-smoke-$mode.log" | tee "native-smoke-$mode.stdout" || smoke_status=$?
            cat "native-smoke-$mode.stdout" >> "native-smoke-$mode.log"
            if [ "$smoke_status" -ne 0 ]; then exit "$smoke_status"; fi
            grep -E '^Rendered 20 native frames at [0-9.]+ pixels per point$' "native-smoke-$mode.stdout"
            if [ "$mode" = editable ]; then
              grep -Fx 'Native rich clipboard roundtrip and undo/redo passed' "native-smoke-$mode.stdout"
            fi
            ./target/debug/check-native-report "native-smoke-$mode.json" --revision "$TEXTLOOM_QA_REVISION" --os macos --mode "$mode"
            cp "native-smoke-$mode.json" "native-observations/$mode.json"
          done
      - name: Native rendering observations (macOS)
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-rendering-macos
          path: |
            native-observations/*.json
            native-smoke-*.log
            native-smoke-*.stdout
          if-no-files-found: warn
          retention-days: 14

  linux-renderer:
    name: Native rendering (Linux X11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            examples/native-editor -> ../../target
            scripts/qa-tools -> ../../target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install virtual display and software renderer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libegl1 libgl1-mesa-dri libglx-mesa0 libxkbcommon0 libxkbcommon-x11-0 xauth xvfb
      - name: Build native renderer and report validator
        run: |
          cargo build --locked --manifest-path examples/native-editor/Cargo.toml --target-dir target
          cargo build --locked --manifest-path scripts/qa-tools/Cargo.toml --target-dir target --bin check-native-report
      - name: Native rendering smoke
        timeout-minutes: 2
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          mkdir -p native-observations
          for mode in editable read-only disabled; do
            args=(--smoke-test --rich-clipboard --qa-report "native-smoke-$mode.json")
            case "$mode" in
              editable) args+=(--clipboard-self-test) ;;
              read-only) args+=(--read-only) ;;
              disabled) args+=(--disabled) ;;
            esac
            smoke_status=0
            env -u WAYLAND_DISPLAY -u WAYLAND_SOCKET xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' ./target/debug/textloom-native-example "${args[@]}" 2> "native-smoke-$mode.log" | tee "native-smoke-$mode.stdout" || smoke_status=$?
            cat "native-smoke-$mode.stdout" >> "native-smoke-$mode.log"
            if [ "$smoke_status" -ne 0 ]; then exit "$smoke_status"; fi
            grep -E '^Rendered 20 native frames at [0-9.]+ pixels per point$' "native-smoke-$mode.stdout"
            if [ "$mode" = editable ]; then
              grep -Fx 'Native rich clipboard roundtrip and undo/redo passed' "native-smoke-$mode.stdout"
            fi
            ./target/debug/check-native-report "native-smoke-$mode.json" --revision "$TEXTLOOM_QA_REVISION" --os linux --mode "$mode"
            cp "native-smoke-$mode.json" "native-observations/$mode.json"
          done
      - name: Native rendering observations (Linux X11)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-rendering-linux-x11
          path: |
            native-observations/*.json
            native-smoke-*.log
          if-no-files-found: warn
          retention-days: 14

  windows-renderer:
    name: Native rendering (Windows Mesa)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            . -> target
            examples/native-editor -> ../../target
            scripts/qa-tools -> ../../target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build native renderer and report validator
        run: |
          cargo build --locked --manifest-path examples/native-editor/Cargo.toml --target-dir target
          cargo build --locked --manifest-path scripts/qa-tools/Cargo.toml --target-dir target --bin check-native-report
      - name: Install signed Mesa software renderer
        id: mesa
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          release: false
          update: true
          install: mingw-w64-ucrt-x86_64-mesa
      - name: Record renderer package versions
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -Q | tee native-smoke-mesa-packages.log
      - name: Native rendering smoke (Windows Mesa)
        timeout-minutes: 2
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.mesa.outputs.msys2-location }}
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: |
          $mesaRuntimeDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $nativeProbeDirectory = Join-Path $env:RUNNER_TEMP 'textloom-mesa-smoke'
          New-Item -ItemType Directory -Path $nativeProbeDirectory | Out-Null
          Copy-Item -LiteralPath ./target/debug/textloom-native-example.exe -Destination $nativeProbeDirectory
          Copy-Item -LiteralPath "$mesaRuntimeDirectory\opengl32.dll" -Destination $nativeProbeDirectory
          Copy-Item -LiteralPath "$mesaRuntimeDirectory\libgallium_wgl.dll" -Destination $nativeProbeDirectory
          $env:PATH = "$mesaRuntimeDirectory;$env:PATH"
          $env:GLUTIN_WGL_OPENGL_DLL = Join-Path $nativeProbeDirectory 'opengl32.dll'
          $nativeProbeExecutable = Join-Path $nativeProbeDirectory 'textloom-native-example.exe'
          New-Item -ItemType Directory -Path native-observations | Out-Null
          foreach ($mode in @('editable', 'read-only', 'disabled')) {
            $smokeArguments = @('--smoke-test', '--rich-clipboard', '--qa-report', "native-smoke-$mode.json")
            if ($mode -eq 'editable') {
              $smokeArguments += '--clipboard-self-test'
            } elseif ($mode -eq 'read-only') {
              $smokeArguments += '--read-only'
            } elseif ($mode -eq 'disabled') {
              $smokeArguments += '--disabled'
            }
            & $nativeProbeExecutable @smokeArguments 2> "native-smoke-$mode.log" | Tee-Object -Variable smokeStdout
            $nativeSmokeExitCode = $LASTEXITCODE
            $smokeStdout | Add-Content -LiteralPath "native-smoke-$mode.log"
            if ($nativeSmokeExitCode -ne 0) {
              exit $nativeSmokeExitCode
            }
            if (-not ($smokeStdout -cmatch '^Rendered 20 native frames at [0-9.]+ pixels per point$')) {
              throw "The $mode native renderer did not complete 20 frames"
            }
            if ($mode -eq 'editable' -and -not (@($smokeStdout) -ccontains 'Native rich clipboard roundtrip and undo/redo passed')) {
              throw 'The native rich clipboard roundtrip and undo/redo did not pass'
            }
            ./target/debug/check-native-report.exe "native-smoke-$mode.json" --revision "$env:TEXTLOOM_QA_REVISION" --os windows --mode "$mode"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            Copy-Item -LiteralPath "native-smoke-$mode.json" -Destination "native-observations/$mode.json"
          }
      - name: Native rendering observations (Windows Mesa)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-rendering-windows-mesa
          path: |
            native-observations/*.json
            native-smoke-*.log
          if-no-files-found: warn
          retention-days: 14
