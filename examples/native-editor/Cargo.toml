[package]
name = "textloom-native-example"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Keep the renderer and window integration out of Textloom's dependency graph.
[workspace]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
textloom = { path = "../..", version = "1.0", features = ["egui"] }
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.4"
x11rb = { version = "0.13.2", default-features = false }
rustix = { version = "1", features = ["event", "fs", "pipe"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = { version = "5.4.1", features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
