[package]
name = "tlqa-winit-harness"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1"
softbuffer = "0.4.8"
textloom = { path = "../../..", features = ["winit"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }

[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
# Google Rust Style Guide rules that Clippy checks outside its default lints.
missing_panics_doc = "warn"
must_use_candidate = "warn"
needless_for_each = "warn"
ref_option = "warn"
return_self_not_must_use = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"
