[package]
name = "textloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A reusable native rich-text editing core with optional egui, winit, and AccessKit adapters"
license = "MIT"
keywords = ["rich-text", "editor", "native", "egui", "unicode"]
categories = ["gui", "text-editors"]
readme = "README.md"
repository = "https://github.com/Cameron-Lyons/textloom"

[features]
default = []
egui = ["dep:egui"]
winit = ["dep:winit"]
accesskit = ["dep:accesskit"]

[dependencies]
unicode-segmentation = "1.13"
egui = { version = "0.36", optional = true, default-features = false, features = ["default_fonts"] }
winit = { version = "0.30", optional = true, default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
accesskit = { version = "0.24", optional = true, default-features = false }

[[example]]
name = "egui_editor"
required-features = ["egui"]

[[example]]
name = "winit_input"
required-features = ["winit"]

[[bench]]
name = "editing"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
