[package]
name = "textloom"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
description = "A reusable native rich-text editing core with optional egui, winit, and AccessKit adapters"
license = "MIT"
keywords = ["rich-text", "editor", "native", "egui", "unicode"]
categories = ["gui", "text-editors"]
readme = "README.md"
repository = "https://github.com/Cameron-Lyons/textloom"
documentation = "https://docs.rs/textloom"
include = [
    "/src/**",
    "/tests/**",
    "/examples/*.rs",
    "/benches/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/BENCHMARKS.md",
    "/CHANGELOG.md",
    "/RELEASING.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
egui = ["dep:egui"]
winit = ["dep:winit"]
accesskit = ["dep:accesskit"]

[dependencies]
unicode-segmentation = "=1.13.3"
egui = { version = "0.36", optional = true, default-features = false }
winit = { version = "0.30", optional = true, default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }
accesskit = { version = "0.24.1", optional = true, default-features = false }

[dev-dependencies]
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
accesskit_consumer = "0.38"

[[example]]
name = "egui_editor"
required-features = ["egui"]

[[example]]
name = "winit_input"
required-features = ["winit"]

[[bench]]
name = "editing"
harness = false

[[bench]]
name = "rendering"
harness = false
required-features = ["egui"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

